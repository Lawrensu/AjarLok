<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AjarLok</title>
<meta name="description" content="Tutor STEM yang faham bahasa kitak, jimat data.">
<style>
:root{--bg:#fffaf2;--card:#fff;--ink:#1d1b16;--muted:#6b6457;--brand:#c2410c;--brand2:#0f766e;--line:#eadfcd;--me:#fde7d4}
*{box-sizing:border-box}
body{margin:0;font:17px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:20px;margin:0;color:var(--brand)}
h1 small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.sp{flex:1}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.pill.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
#levels{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--line)}
#levels button{flex:none}
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);word-wrap:break-word}
.me{align-self:flex-end;background:var(--me);border-color:transparent}
.me img{max-width:160px;border-radius:8px;display:block;margin-bottom:4px}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts button{font-size:14px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.diagram{display:block;width:100%;max-width:600px;margin-top:10px;border-radius:10px;border:1px solid var(--line);background:#fff}
.hello{color:var(--muted);text-align:center;margin:auto 10px}
.hello b{color:var(--ink)}
footer{border-top:1px solid var(--line);background:var(--card);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#attach{display:none;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
#attach img{height:48px;border-radius:6px}
.row{display:flex;gap:8px}
textarea{flex:1;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);resize:none;height:48px}
#send{padding:0 18px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:600}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.big button{border:0;border-radius:14px;padding:10px 4px;background:var(--brand2);color:#fff;font:inherit;font-weight:600;line-height:1.2}
.big button span{display:block;font-size:26px}
.big button small{display:block;font-weight:400;font-size:12px;opacity:.85}
.big button.rec{background:#b91c1c}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <h1>AjarLok<small>Tutor STEM kitak</small></h1>
  <span class="sp"></span>
  <span class="pill" id="data" title="Data digunakan">0 KB</span>
  <button class="pill" id="jimat">Jimat Data</button>
</header>
<div id="levels"></div>
<main id="chat">
  <p class="hello" id="hello"></p>
</main>
<footer>
  <div id="attach"><img id="thumb" alt=""><span id="attname"></span><button class="pill" id="clear"></button></div>
  <div class="row">
    <textarea id="text"></textarea>
    <button id="send"></button>
  </div>
  <div class="big">
    <button id="snap"></button>
    <button id="talk"></button>
    <button id="type"></button>
  </div>
  <input type="file" id="file" accept="image/*" capture="environment" hidden>
</footer>
<script>
const $ = id => document.getElementById(id);
const LEVELS = [["darjah1","Darjah 1-3"],["darjah4","Darjah 4-6"],["tingkatan1","Tingkatan 1-3"],["tingkatan4","Tingkatan 4-5"],["universiti","Universiti"]];
const TIERS = {lite:{px:512,q:.5,kbps:12000}, standard:{px:768,q:.6,kbps:16000}, full:{px:1024,q:.7,kbps:24000}};
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};

// ---- UI language follows the device: Malay first on Malay phones, English first elsewhere ----
const MS = /^(ms|id)\b/i.test(navigator.language || "");
const S = {
  snap:["Ambil Gambar","Snap"], talk:["Cakap","Talk"], type:["Taip","Type"], stop:["Berhenti","Stop & send"],
  send:["Hantar","Send"], clear:["Buang","Remove"], jimat:["Jimat Data","Save Data"], on:["ON","ON"],
  ph:["Taip soalan kitak...","Type your question..."], hello:["Selamat datang!","Welcome!"],
  hello2:["Ambil gambar soalan, cakap, atau taip. Bahasa apa pun boleh.","Snap a question, speak, or type. Any language is fine."],
  listen:["Dengar","Listen"], simpler:["Senangkan","Simpler"], local:["Contoh Tempatan","Local Example"], quiz:["Kuiz Saya","Quiz Me"],
  think:["Sedang fikir...","Thinking..."], err:["Maaf, ada masalah. Cuba lagi.","Sorry, something went wrong. Try again."],
  voice:["Rakaman suara","Voice note"], photo:["Gambar","Photo"], up:["naik","up"], down:["turun","down"],
  mic:["Mikrofon tidak dapat dibuka.","Microphone not available."], uni:["Universiti","University"],
  draw:["Lukis","Draw"], drawing:["Sedang melukis...","Drawing..."], drawErr:["Tak dapat lukis. Cuba lagi.","Could not draw. Try again."],
};
const WANTS_DRAWING = /gambar|lukis|rajah|diagram|draw|picture|visual|sketch|图/i;
const t = k => S[k][MS ? 0 : 1], t2 = k => S[k][MS ? 1 : 0];
const bigBtn = (icon, k) => `<span>${icon}</span>${t(k)}<small>${t2(k)}</small>`;
function renderText(){
  $("snap").innerHTML = bigBtn("📷","snap"); $("talk").innerHTML = bigBtn("🎤","talk"); $("type").innerHTML = bigBtn("⌨️","type");
  $("send").textContent = t("send"); $("clear").textContent = t("clear"); $("text").placeholder = `${t("ph")} / ${t2("ph")}`;
  const h = $("hello"); if (h) h.innerHTML = `<b>${t("hello")}</b><br>${t("hello2")}<br><small>${t2("hello2")}</small>`;
  document.documentElement.lang = MS ? "ms" : "en";
}

let level = store.get("level") || "", jimat = store.get("jimat") === "1", netMode = "standard";
let history = [], image = null, audio = null, recorder = null, totalBytes = 0;

// ---- Input Gate: pick a bandwidth tier ----
async function detectMode(){
  const c = navigator.connection;
  if (c) {
    if (c.saveData || /2g/.test(c.effectiveType) || c.downlink < 0.5) return "lite";
    if (c.effectiveType === "3g" || c.downlink < 2) return "standard";
    return "full";
  }
  try { // no Network Information API (iOS): time a tiny request
    const t = performance.now(); await fetch("/api/ping", {cache:"no-store"});
    const rtt = performance.now() - t;
    return rtt > 800 ? "lite" : rtt > 300 ? "standard" : "full";
  } catch { return "lite"; }
}
const mode = () => jimat ? "lite" : netMode;
function renderJimat(){ $("jimat").classList.toggle("on", mode()==="lite"); $("jimat").textContent = t("jimat") + (mode()==="lite" ? ": " + t("on") : ""); }

function compress(file, {px, q}){
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, px / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); cv.toBlob(b => b ? ok(b) : bad(), "image/jpeg", q);
    };
    img.onerror = bad; img.src = url;
  });
}

function detectLevel(t){
  t = t.toLowerCase(); let m;
  if ((m = t.match(/(\d{1,2})\s*(tahun|thn|years?\s*old|yo\b)/))) { const a = +m[1]; return a<=9?"darjah1":a<=12?"darjah4":a<=15?"tingkatan1":a<=17?"tingkatan4":"universiti"; }
  if ((m = t.match(/(darjah|tahun|standard|primary)\s*([1-6])/))) return +m[2] <= 3 ? "darjah1" : "darjah4";
  if ((m = t.match(/(tingkatan|form)\s*([1-5])/))) return +m[2] <= 3 ? "tingkatan1" : "tingkatan4";
  if (/universiti|university|uni\b|kolej|college|diploma|degree/.test(t)) return "universiti";
  return "";
}
function setLevel(l){ level = l; store.set("level", l); renderLevels(); }
function renderLevels(){
  $("levels").innerHTML = "";
  LEVELS.forEach(([k, label]) => {
    const b = document.createElement("button"); b.className = "pill" + (k===level?" on":""); b.textContent = k === "universiti" ? t("uni") : label;
    b.onclick = () => setLevel(k===level ? "" : k); $("levels").append(b);
  });
}

// ---- Rendering ----
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+\s*(.+)$/gm,"<b>$1</b>")
  .replace(/^(\s*)[*-]\s+/gm,"$1• ").replace(/`([^`]+)`/g,"$1").replace(/\n/g,"<br>");
const kb = n => (n/1024).toFixed(1) + " KB";
function add(cls, html){ $("hello")?.remove(); const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; $("chat").append(d); d.scrollIntoView({behavior:"smooth"}); return d; }

function speakLang(text, language){
  const l = (language||"").toLowerCase();
  if (/mandarin|chinese|中文/.test(l) || /[一-鿿]/.test(text)) return "zh-CN";
  if (/english/.test(l)) return "en-US";
  if (/malay|melayu|iban|sarawak/.test(l) || /\b(yang|dan|ialah|adalah|ini|untuk|kita)\b/i.test(text)) return "ms-MY";
  return "en-US";
}
async function speak(text, language, btn){
  speechSynthesis.cancel();
  const plain = text.replace(/[*#_`]/g, "");
  if (mode() === "full") {
    try {
      btn.disabled = true;
      const r = await fetch("/api/tts", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text:plain})});
      if (!r.ok) throw 0;
      const blob = await r.blob(); addBytes(blob.size);
      new Audio(URL.createObjectURL(blob)).play(); return;
    } catch {} finally { btn.disabled = false; }
  }
  const u = new SpeechSynthesisUtterance(plain), lang = speakLang(plain, language);
  u.lang = lang; u.voice = speechSynthesis.getVoices().find(v => v.lang.replace("_","-").startsWith(lang.slice(0,2))) || null;
  speechSynthesis.speak(u);
}
function addBytes(n){ totalBytes += n; $("data").textContent = kb(totalBytes); }

// ---- Diagrams: Gemini writes a small SVG (a few KB), shown via <img> so no script inside it can run ----
async function draw(question, answer, msg, btn){
  if (btn) btn.disabled = true;
  const box = document.createElement("div"); box.className = "meta"; box.textContent = t("drawing"); msg.append(box);
  try {
    const r = await fetch("/api/draw", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({question, answer})});
    const raw = await r.text(); addBytes(new Blob([raw]).size);
    const d = JSON.parse(raw); if (!r.ok) throw new Error(d.detail || r.status);
    const img = new Image(); img.className = "diagram"; img.alt = t("draw");
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(d.svg);
    box.textContent = "🖼️ " + kb(new Blob([d.svg]).size); box.before(img); img.scrollIntoView({behavior:"smooth"});
  } catch (e) { box.textContent = t("drawErr"); if (btn) btn.disabled = false; }
}

// ---- Ask ----
async function ask(action=""){
  const text = $("text").value.trim();
  if (!text && !image && !audio && !action) return;
  const lv = detectLevel(text); if (lv) setLevel(lv);
  const fd = new FormData(), m = mode();
  fd.append("text", text); fd.append("level", level); fd.append("mode", m); fd.append("action", action);
  fd.append("history", JSON.stringify(history.slice(-8)));
  let up = new Blob([text]).size;
  if (image) { fd.append("image", image, "photo.jpg"); up += image.size; }
  if (audio) { fd.append("audio", audio, "voice." + (audio.type.includes("mp4") ? "m4a" : audio.type.includes("ogg") ? "ogg" : "webm")); up += audio.size; }

  const labels = {simpler:t("simpler"), local:t("local"), quiz:t("quiz")};
  add("me", (image ? `<img src="${URL.createObjectURL(image)}" alt="">` : "") + (audio ? `🎤 ${t("voice")}<br>` : "") + esc(text || labels[action] || ""));
  $("text").value = ""; clearAttach();
  const wait = add("", t("think"));
  $("send").disabled = true;
  try {
    const r = await fetch("/api/ask", {method:"POST", body:fd});
    const raw = await r.text(), down = new Blob([raw]).size;
    addBytes(up + down);
    const d = JSON.parse(raw);
    if (!r.ok) throw new Error(d.detail || r.status);
    history.push({role:"user", content: d.question || text || labels[action]}, {role:"assistant", content:d.answer});
    wait.innerHTML = fmt(d.answer) + `<div class="meta">${m==="lite"?t("jimat")+" · ":""}${kb(up)} ${t("up")} · ${kb(down)} ${t("down")} · ${esc(d.provider)}</div>`;
    const acts = document.createElement("div"); acts.className = "acts";
    const q = d.question || text || labels[action] || "";
    // Follow-up buttons match the answer's language: a Malay answer gets Malay buttons
    const L = k => speakLang(d.answer, d.language) === "ms-MY" ? S[k][0] : t(k);
    [["🔊 " + L("listen"), b => speak(d.answer, d.language, b)], ["🖼️ " + L("draw"), b => draw(q, d.answer, wait, b)],
     ["💡 " + L("simpler"), () => ask("simpler")], ["🌾 " + L("local"), () => ask("local")], ["❓ " + L("quiz"), () => ask("quiz")]]
      .forEach(([t, fn]) => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => fn(b); acts.append(b); });
    wait.append(acts);
    if (WANTS_DRAWING.test(text)) draw(q, d.answer, wait, acts.children[1]);
  } catch (e) {
    wait.innerHTML = t("err") + "<div class='meta'>" + esc(String(e.message||e)) + "</div>";
  } finally { $("send").disabled = false; }
}

function clearAttach(){ image = audio = null; $("attach").style.display = "none"; $("file").value = ""; }
function showAttach(label, src){ $("attach").style.display = "flex"; $("attname").textContent = label; $("thumb").style.display = src ? "" : "none"; if (src) $("thumb").src = src; }

$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { image = await compress(f, TIERS[mode()]); } catch { image = f; }
  showAttach(`${t("photo")} ${kb(f.size)} → ${kb(image.size)}`, URL.createObjectURL(image));
};
$("talk").onclick = async () => {
  if (recorder) { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = ["audio/webm;codecs=opus","audio/ogg;codecs=opus","audio/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    const chunks = [];
    recorder = new MediaRecorder(stream, {mimeType:mime, audioBitsPerSecond:TIERS[mode()].kbps});
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop()); recorder = null;
      $("talk").classList.remove("rec"); $("talk").innerHTML = bigBtn("🎤","talk");
      audio = new Blob(chunks, {type:(mime||"audio/webm").split(";")[0]}); ask();
    };
    recorder.start();
    $("talk").classList.add("rec"); $("talk").innerHTML = bigBtn("⏹","stop");
  } catch { alert(t("mic")); }
};
$("snap").onclick = () => $("file").click();
$("type").onclick = () => $("text").focus();
$("send").onclick = () => ask();
$("clear").onclick = clearAttach;
$("text").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } };
$("jimat").onclick = () => { jimat = !jimat; store.set("jimat", jimat?"1":"0"); renderJimat(); };

renderText(); renderLevels(); renderJimat();
detectMode().then(m => { netMode = m; renderJimat(); });
navigator.connection?.addEventListener?.("change", () => detectMode().then(m => { netMode = m; renderJimat(); }));
</script>
</body>
</html>
